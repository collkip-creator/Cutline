[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clippah-core"
version = "0.1.0"
description = "Local-first, cross-platform AI video clipping core & pluggable engine adapters"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
desktop = [
    "faster-whisper>=1.0.3",
    "yt-dlp>=2024.10.0",
    "PyQt6>=6.7.0",
]
tauri-sidecar = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
android = [
    # Android (Chaquopy / Briefcase) omits desktop faster-whisper & PyQt6;
    # uses whisper.cpp JNI or ONNX Runtime + Android Media3 Transformer.
]

[project.scripts]
clippah-cli = "clippah_core.cli:main"
