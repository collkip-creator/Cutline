name: Build Windows Installer (Tauri v2 NSIS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Python sidecar + static media binaries + Tauri NSIS .exe
        shell: pwsh
        run: .\clippah_core\packaging\tauri_windows\build_tauri_windows.ps1

      - name: Upload Windows Setup .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cutline-Studio-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
